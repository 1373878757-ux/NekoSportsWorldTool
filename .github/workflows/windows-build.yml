name: Windows customized build

on:
  workflow_dispatch:
  push:
    branches: [feature/j-claude-cross-platform]
    tags: ["jclaude-v*"]
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "assets/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".gitattributes"
      - ".github/workflows/windows-build.yml"
      - "README-Windows.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: windows-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      NSWT_BUILD_COMMIT: ${{ github.sha }}
      NSWT_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated Cargo and static-runtime flags
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "nswt-cargo"
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $flags = "-C target-feature=+crt-static --remap-path-prefix=$($env:GITHUB_WORKSPACE)=. --remap-path-prefix=$cargoHome=cargo"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-static-custom
      - name: Check and test GUI plus CLI
        shell: pwsh
        run: |
          cargo check --locked --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --workspace --locked --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify CLI-only feature boundary
        shell: pwsh
        run: |
          cargo check --locked --no-default-features --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --workspace --locked --no-default-features --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --no-default-features --bin nekosportsworldtool --target $env:TARGET --target-dir "$env:RUNNER_TEMP/nswt-cli-target"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NSWT_OFFLINE = "1"
          & "$env:RUNNER_TEMP/nswt-cli-target/$env:TARGET/release/nekosportsworldtool.exe" --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/nswt-cli-target/$env:TARGET/release/nekosportsworldtool.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build distributable GUI plus CLI
        shell: pwsh
        run: |
          cargo build --release --locked --bin nekosportsworldtool --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Inspect, package, checksum and smoke test the extracted EXE
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NekoSportsWorldTool-J-claude-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
